# 个人记事本 HTML 静态网页

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的记事本</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
    background: #f5f6f8;
    color: #1f2937;
    height: 100vh;
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}

/* =========================
   主体布局
========================= */

.app {
    display: flex;
    height: 100vh;
}

/* =========================
   左侧菜单
========================= */

.sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    padding: 22px 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 21px;
    font-weight: 700;
    padding: 0 10px 25px;
}

.new-note {
    width: 100%;
    background: #2563eb;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 20px;
    transition: .2s;
}

.new-note:hover {
    background: #1d4ed8;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 12px;
    border-radius: 8px;
    color: #4b5563;
}

.menu-item:hover {
    background: #f3f4f6;
}

.menu-item.active {
    background: #e8f0ff;
    color: #2563eb;
    font-weight: 600;
}

.count {
    font-size: 12px;
    background: #f1f5f9;
    padding: 2px 7px;
    border-radius: 20px;
}

.category-title {
    font-size: 12px;
    color: #9ca3af;
    padding: 25px 12px 8px;
}

/* =========================
   中间列表
========================= */

.note-list {
    width: 320px;
    background: #fafafa;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
}

.list-header {
    padding: 20px;
    border-bottom: 1px solid #e5e7eb;
}

.list-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 15px;
}

.search {
    width: 100%;
    padding: 10px 13px;
    border: 1px solid #e5e7eb;
    border-radius: 9px;
    outline: none;
    background: white;
}

.search:focus {
    border-color: #2563eb;
}

.notes {
    overflow-y: auto;
    flex: 1;
}

.note-item {
    padding: 16px 18px;
    border-bottom: 1px solid #eeeeee;
    cursor: pointer;
    background: transparent;
}

.note-item:hover {
    background: #f3f4f6;
}

.note-item.active {
    background: white;
    border-left: 3px solid #2563eb;
}

.note-title {
    font-weight: 600;
    margin-bottom: 7px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.note-preview {
    font-size: 13px;
    color: #6b7280;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.note-date {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 8px;
}

/* =========================
   编辑区域
========================= */

.editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: white;
    min-width: 0;
}

.editor-header {
    height: 65px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.editor-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: #f3f4f6;
    color: #4b5563;
}

.icon-btn:hover {
    background: #e5e7eb;
}

.delete-btn:hover {
    background: #fee2e2;
    color: #dc2626;
}

.editor-body {
    flex: 1;
    padding: 35px 55px;
    overflow-y: auto;
}

.title-input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 15px;
}

.content-input {
    width: 100%;
    min-height: 500px;
    resize: none;
    border: none;
    outline: none;
    font-size: 16px;
    line-height: 1.9;
    color: #374151;
}

.status {
    font-size: 12px;
    color: #9ca3af;
}

/* =========================
   空白页面
========================= */

.empty {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #9ca3af;
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

/* =========================
   响应式
========================= */

@media (max-width: 900px) {

    .sidebar {
        width: 190px;
    }

    .note-list {
        width: 270px;
    }

    .editor-body {
        padding: 25px;
    }
}

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .note-list {
        width: 100%;
    }

    .editor {
        display: none;
    }

    .note-list.mobile-open {
        display: none;
    }

    body.editing .note-list {
        display: none;
    }

    body.editing .editor {
        display: flex;
        width: 100%;
    }

    .editor-body {
        padding: 20px;
    }

    .title-input {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 左侧菜单 -->
    <aside class="sidebar">

        <div class="logo">
            📝 我的记事本
        </div>

        <button class="new-note" onclick="createNote()">
            ＋ 新建笔记
        </button>

        <div class="menu">

            <div class="menu-item active"
                 onclick="filterNotes('all', this)">
                <span>📚 全部笔记</span>
                <span class="count" id="allCount">0</span>
            </div>

            <div class="menu-item"
                 onclick="filterNotes('favorite', this)">
                <span>⭐ 我的收藏</span>
                <span class="count" id="favoriteCount">0</span>
            </div>

            <div class="menu-item"
                 onclick="filterNotes('pinned', this)">
                <span>📌 置顶笔记</span>
                <span class="count" id="pinnedCount">0</span>
            </div>

            <div class="menu-item"
                 onclick="filterNotes('trash', this)">
                <span>🗑️ 回收站</span>
                <span class="count" id="trashCount">0</span>
            </div>

        </div>

        <div class="category-title">
            快捷分类
        </div>

        <div class="menu">

            <div class="menu-item"
                 onclick="filterNotes('work', this)">
                💼 工作
            </div>

            <div class="menu-item"
                 onclick="filterNotes('life', this)">
                🏠 生活
            </div>

            <div class="menu-item"
                 onclick="filterNotes('idea', this)">
                💡 灵感
            </div>

        </div>

    </aside>


    <!-- 笔记列表 -->
    <section class="note-list">

        <div class="list-header">

            <div class="list-title">
                我的笔记
            </div>

            <input
                id="searchInput"
                class="search"
                placeholder="🔍 搜索笔记..."
                oninput="searchNotes()"
            >

        </div>

        <div id="notes" class="notes"></div>

    </section>


    <!-- 编辑器 -->
    <main class="editor">

        <div class="editor-header">

            <div class="status" id="saveStatus">
                已保存
            </div>

            <div class="editor-actions">

                <button
                    class="icon-btn"
                    onclick="toggleFavorite()"
                    title="收藏">
                    ⭐
                </button>

                <button
                    class="icon-btn"
                    onclick="togglePin()"
                    title="置顶">
                    📌
                </button>

                <button
                    class="icon-btn delete-btn"
                    onclick="deleteCurrentNote()"
                    title="删除">
                    🗑️
                </button>

            </div>

        </div>

        <div class="editor-body">

            <input
                id="titleInput"
                class="title-input"
                placeholder="笔记标题"
                oninput="saveCurrentNote()"
            >

            <textarea
                id="contentInput"
                class="content-input"
                placeholder="开始记录你的想法……"
                oninput="saveCurrentNote()"
            ></textarea>

        </div>

    </main>

</div>


<script>

let notes = JSON.parse(
    localStorage.getItem("myNotes")
) || [];

let currentId = null;
let currentFilter = "all";
let searchKeyword = "";


/* =========================
   初始化
========================= */

function init() {

    if (notes.length === 0) {

        const welcome = {
            id: Date.now(),
            title: "欢迎使用我的记事本",
            content:
`这是一个简单的个人记事本。

你可以在这里记录：

• 工作事项
• 学习笔记
• 生活记录
• 突发灵感
• 待办事项

所有内容都会自动保存在当前浏览器中。`,
            favorite: false,
            pinned: true,
            trash: false,
            category: "work",
            updated: Date.now()
        };

        notes.push(welcome);

        saveData();
    }

    currentId = notes[0].id;

    renderNotes();
    loadCurrentNote();
}


/* =========================
   保存数据
========================= */

function saveData() {

    localStorage.setItem(
        "myNotes",
        JSON.stringify(notes)
    );

}


/* =========================
   新建笔记
========================= */

function createNote() {

    const note = {

        id: Date.now(),

        title: "新建笔记",

        content: "",

        favorite: false,

        pinned: false,

        trash: false,

        category: "work",

        updated: Date.now()

    };

    notes.unshift(note);

    currentId = note.id;

    saveData();

    renderNotes();

    loadCurrentNote();

    document.getElementById("titleInput").focus();

    document.body.classList.add("editing");
}


/* =========================
   加载笔记
========================= */

function loadCurrentNote() {

    const note = notes.find(
        n => n.id === currentId
    );

    if (!note) return;

    document.getElementById("titleInput").value =
        note.title;

    document.getElementById("contentInput").value =
        note.content;

    document.getElementById("saveStatus").textContent =
        "已保存";

}


/* =========================
   保存当前笔记
========================= */

function saveCurrentNote() {

    const note = notes.find(
        n => n.id === currentId
    );

    if (!note) return;

    note.title =
        document.getElementById("titleInput").value ||
        "无标题笔记";

    note.content =
        document.getElementById("contentInput").value;

    note.updated = Date.now();

    saveData();

    document.getElementById("saveStatus").textContent =
        "保存中...";

    clearTimeout(window.saveTimer);

    window.saveTimer = setTimeout(() => {

        document.getElementById("saveStatus").textContent =
            "已保存";

        renderNotes();

    }, 500);

}


/* =========================
   显示笔记列表
========================= */

function renderNotes() {

    const container =
        document.getElementById("notes");

    let filtered = notes.filter(note => {

        if (currentFilter === "trash")
            return note.trash;

        if (note.trash)
            return false;

        if (currentFilter === "favorite")
            return note.favorite;

        if (currentFilter === "pinned")
            return note.pinned;

        if (
            ["work", "life", "idea"]
            .includes(currentFilter)
        )
            return note.category === currentFilter;

        return true;

    });

    if (searchKeyword) {

        filtered = filtered.filter(note =>

            note.title
                .toLowerCase()
                .includes(searchKeyword.toLowerCase())

            ||

            note.content
                .toLowerCase()
                .includes(searchKeyword.toLowerCase())

        );

    }

    filtered.sort((a, b) => {

        if (a.pinned !== b.pinned)
            return b.pinned - a.pinned;

        return b.updated - a.updated;

    });


    if (filtered.length === 0) {

        container.innerHTML = `
            <div style="
                padding:40px 20px;
                text-align:center;
                color:#9ca3af;
            ">
                没有找到笔记
            </div>
        `;

        updateCounts();

        return;
    }


    container.innerHTML = filtered.map(note => {

        const preview =
            note.content
                .replace(/\n/g, " ")
                .slice(0, 80);

        const date =
            formatDate(note.updated);

        return `

        <div
            class="note-item
            ${note.id === currentId ? "active" : ""}"
            onclick="selectNote(${note.id})"
        >

            <div class="note-title">

                ${note.pinned ? "📌 " : ""}
                ${note.favorite ? "⭐ " : ""}
                ${escapeHtml(note.title)}

            </div>

            <div class="note-preview">
                ${escapeHtml(preview)}
            </div>

            <div class="note-date">
                ${date}
            </div>

        </div>

        `;

    }).join("");

    updateCounts();

}


/* =========================
   选择笔记
========================= */

function selectNote(id) {

    currentId = id;

    loadCurrentNote();

    renderNotes();

    document.body.classList.add("editing");

}


/* =========================
   删除笔记
========================= */

function deleteCurrentNote() {

    const note = notes.find(
        n => n.id === currentId
    );

    if (!note) return;


    if (!note.trash) {

        note.trash = true;

        saveData();

        renderNotes();

        alert("笔记已移动到回收站");

        return;
    }


    if (
        confirm("确定要永久删除这条笔记吗？")
    ) {

        notes = notes.filter(
            n => n.id !== currentId
        );

        saveData();

        currentId =
            notes.length ?
            notes[0].id :
            null;

        renderNotes();

        if (currentId)
            loadCurrentNote();

    }

}


/* =========================
   收藏
========================= */

function toggleFavorite() {

    const note = notes.find(
        n => n.id === currentId
    );

    if (!note) return;

    note.favorite = !note.favorite;

    saveData();

    renderNotes();

}


/* =========================
   置顶
========================= */

function togglePin() {

    const note = notes.find(
        n => n.id === currentId
    );

    if (!note) return;

    note.pinned = !note.pinned;

    saveData();

    renderNotes();

}


/* =========================
   筛选
========================= */

function filterNotes(filter, element) {

    currentFilter = filter;

    document
        .querySelectorAll(".menu-item")
        .forEach(item => {
            item.classList.remove("active");
        });

    if (element)
        element.classList.add("active");

    renderNotes();

}


/* =========================
   搜索
========================= */

function searchNotes() {

    searchKeyword =
        document
        .getElementById("searchInput")
        .value;

    renderNotes();

}


/* =========================
   统计
========================= */

function updateCounts() {

    document.getElementById("allCount").textContent =
        notes.filter(n => !n.trash).length;

    document.getElementById("favoriteCount").textContent =
        notes.filter(n => n.favorite && !n.trash).length;

    document.getElementById("pinnedCount").textContent =
        notes.filter(n => n.pinned && !n.trash).length;

    document.getElementById("trashCount").textContent =
        notes.filter(n => n.trash).length;

}


/* =========================
   日期格式
========================= */

function formatDate(timestamp) {

    const date =
        new Date(timestamp);

    const now =
        new Date();

    if (
        date.toDateString() ===
        now.toDateString()
    ) {

        return date.toLocaleTimeString(
            "zh-CN",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }

    return date.toLocaleDateString(
        "zh-CN"
    );

}


/* =========================
   HTML 防注入
========================= */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   快捷键
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        /* Ctrl + N 新建 */

        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "n"
        ) {

            e.preventDefault();

            createNote();

        }


        /* Ctrl + F 搜索 */

        if (
            e.ctrlKey &&
            e.key.toLowerCase() === "f"
        ) {

            e.preventDefault();

            document
                .getElementById("searchInput")
                .focus();

        }

    }
);


/* 启动 */

init();

</script>

</body>
</html>
```
